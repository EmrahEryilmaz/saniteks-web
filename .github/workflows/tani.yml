# Temporary read-only diagnostics of the live site (runs only on tani/** branches).
name: Tanı
on:
  push:
    branches: ["tani/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canlı siteyi incele
        run: |
          set +e
          B=https://www.saniteks.com.tr
          for u in "/urunler" "/" "/urunler/temizlik-sungerleri/oluklu-temizlik-sungeri"; do
            echo "=================== GET $u"
            curl -sS -m 30 -D h.txt -o b.html "$B$u"; grep -iE "^HTTP|^content-length" h.txt
            echo "-- markers: newCat=$(grep -c 'category-sponges-2026' b.html) newSku=$(grep -c 'super-tekli-oluklu-2026' b.html) oldTitle=$(grep -c 'Rulo Non-Woven Temizlik' b.html) favicon=$(grep -c 'favicon.ico' b.html)"
            bad=0; for c in $(grep -oE '/_next/static/[A-Za-z0-9_./-]+\.(js|css)' b.html | sort -u); do code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" "$B$c"); [ "$code" = 200 ] || { bad=$((bad+1)); echo "MISSING $code $c"; }; done; echo "-- missing js/css: $bad"
          done
          echo "=================== assets"
          for u in /favicon.ico /images/icons/saniteks-icon-32.png /images/logo/saniteks-logo.png /images/catalog/106-0-202-24-2026.webp /images/products/category-sponges-2026.webp /images/products/category-cloths.webp /documents/catalogs/sanifoam-sanitex-product-catalog-en.pdf /manifest.webmanifest /sitemap.xml /robots.txt /iletisim /kataloglar /urunler/ozel-marka-uretimi /app.js /server.js /package.json "/_next/image?url=%2Fimages%2Fcatalog%2F106-0-202-24-2026.webp&w=640&q=75"; do
            printf "%s -> " "$u"; curl -sS -m 30 -o /dev/null -w "%{http_code} %{content_type} %{size_download}B\n" "$B$u"
          done
          printf "old image redirect -> "; curl -sS -m 30 -o /dev/null -w "%{http_code} %{redirect_url}\n" "$B/images/catalog/106-0-202-24.webp"
