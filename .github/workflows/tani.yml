# Temporary read-only diagnostics of the live site (runs only on tani/** branches).
name: Tanı
on:
  push:
    branches: ["tani/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canlı siteyi incele
        run: |
          set +e
          B=https://www.saniteks.com.tr
          echo "=================== chunks (old-only then new-only)"
          for c in 2eexehf6x4wzw.js 3ieyw4jmp84eo.css ; do printf "old %s -> " $c; curl -sS -m 30 -o /dev/null -w "%{http_code}\n" "$B/_next/static/chunks/$c"; done
          for c in 0q6yg7ul0p1yc.css 1vabkgf7_opyo.js ; do printf "new %s -> " $c; curl -sS -m 30 -o /dev/null -w "%{http_code}\n" "$B/_next/static/chunks/$c"; done
          echo "=================== favicon headers"; curl -sS -m 30 -D - -o /dev/null "$B/favicon.ico"
          echo "=================== icon png headers"; curl -sS -m 30 -D - -o /dev/null "$B/images/icons/saniteks-icon-32.png"
          echo "=================== dynamic: api"; curl -sS -m 30 -D - -o /dev/null "$B/api/contact" | head -12
          echo "=================== dynamic: product page"; curl -sS -m 30 -D h.txt -o b.html "$B/urunler/temizlik-sungerleri"; grep -iE "^HTTP|x-nextjs|content-length|etag" h.txt; echo "iconsOld=$(grep -c 'href="/icons/' b.html) iconsNew=$(grep -c '/images/icons/' b.html) favicon=$(grep -c 'favicon.ico' b.html)"
          echo "=================== 404 page"; curl -sS -m 30 -o b.html "$B/olmayan-sayfa-tani"; echo "iconsOld=$(grep -c 'href="/icons/' b.html) iconsNew=$(grep -c '/images/icons/' b.html) favicon=$(grep -c 'favicon.ico' b.html)"
          echo "=================== rsc"; curl -sS -m 30 -H "RSC: 1" -o b.txt -D h.txt "$B/urunler/ozel-marka-uretimi"; grep -iE "^HTTP|content-length|x-nextjs" h.txt; echo "CleanFun=$(grep -c 'Clean & Fun' b.txt)"
