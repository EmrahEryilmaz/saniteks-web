# Temporary read-only diagnostics of the live site (runs only on tani/** branches).
name: Tanı
on:
  push:
    branches: ["tani/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sanifoam.com.tr incele
        run: |
          set +e
          B=https://www.sanifoam.com.tr
          curl -sSL -m 40 -A "Mozilla/5.0" -D h.txt -o home.html "$B/"; grep -iE "^HTTP|^location|^server|^x-powered" h.txt
          python3 - <<'EOF'
          import re,html
          s=open('home.html',encoding='utf-8',errors='replace').read()
          print('LEN',len(s)); print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',s,re.S)[:1])
          print('DESC',re.findall(r'<meta[^>]+name="description"[^>]+content="([^"]*)"',s)[:1])
          print('NEXT', '/_next/' in s, 'lang', re.findall(r'<html[^>]*lang="([^"]+)"',s))
          links=[]
          for h,t in re.findall(r'<a[^>]+href="([^"#]+)"[^>]*>(.*?)</a>',s,re.S):
              t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=' '.join(t.split())
              if (h,t) not in links: links.append((h,t))
          print('--- LINKS'); [print(h,'|',t[:80]) for h,t in links[:140]]
          print('--- HEADINGS')
          for tag,t in re.findall(r'<(h[1-3])[^>]*>(.*?)</\1>',s,re.S):
              t=html.unescape(re.sub(r'<[^>]+>',' ',t)); print(tag,' '.join(t.split())[:140])
          print('--- saniteks mentions'); [print(' ',x[:200]) for x in re.findall(r'[^<>]{0,80}[Ss]aniteks[^<>]{0,80}',s)[:12]]
          EOF
          for u in /sitemap.xml /kurumsal /kurumsal/grup-sirketleri /markalar /urunler /en; do printf "%s -> " $u; curl -sS -m 30 -A "Mozilla/5.0" -o /dev/null -w "%{http_code} %{redirect_url}\n" "$B$u"; done
          echo "--- sitemap"; curl -sSL -m 30 -A "Mozilla/5.0" "$B/sitemap.xml" | grep -oE '<loc>[^<]+' | sed 's/<loc>//' | head -120
